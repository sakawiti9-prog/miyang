<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 미양초등학교 학교관리 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .tab-active {
      background-color: #1e293b;
      color: #ffffff;
    }
    .tab-inactive {
      background-color: #ffffff;
      color: #334155;
    }
    .tab-inactive:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <!-- 상단 헤더 -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-700">2027 학년도</span>
          <span id="roomBadge" class="px-2.5 py-0.5 text-xs font-medium rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">로컬/공유 모드</span>
        </div>
        <h1 class="text-xl md:text-2xl font-bold text-slate-900 mt-1">미양초등학교 학교관리 대시보드</h1>
        <p class="text-xs md:text-sm text-slate-500 mt-0.5">오늘의 학교일지 · 시간표 · 학생 명부 · 학교행사 달력 · 통학버스 · 강사·특별실</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <label class="text-xs font-semibold text-slate-600" for="baseDateInput">기준일</label>
        <input id="baseDateInput" type="date" onchange="changeBaseDate(this.value)" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm bg-white" />
        <button type="button" onclick="jumpToBaseDate('2027-03-02')" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">3/2(화)</button>
        <button type="button" onclick="jumpToBaseDate('2027-08-17')" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">8/17(화)</button>
        <button type="button" onclick="jumpToToday()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700">오늘</button>
        <button type="button" onclick="openCollabModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm">공동 편집</button>
      </div>
    </header>

    <!-- 내비게이션 탭 -->
    <nav class="flex flex-wrap gap-2">
      <button type="button" data-tab="dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-active">오늘의 학교일지</button>
      <button type="button" data-tab="timetable" onclick="switchTab('timetable')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive">시간표</button>
      <button type="button" data-tab="students" onclick="switchTab('students')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive">학생 명부</button>
      <button type="button" data-tab="events" onclick="switchTab('events')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive">학교행사 달력</button>
      <button type="button" data-tab="bus" onclick="switchTab('bus')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive">통학버스</button>
      <button type="button" data-tab="resources" onclick="switchTab('resources')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive">강사·특별실</button>
      <button type="button" data-tab="admin" onclick="switchTab('admin')" class="tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive">관리자 모드</button>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <main id="mainContent" class="space-y-6"></main>
  </div>

  <!-- 공동 편집 방 · 링크 설정 모달 -->
  <div id="collabModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900">공동 편집 방 · 실시간 저장 설정</h2>
        <button type="button" onclick="closeCollabModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
      </div>
      <p class="text-xs text-slate-600 leading-relaxed">
        같은 방 코드와 실시간 데이터베이스(Firebase Realtime Database REST URL)를 설정하면 링크를 공유한 동료들과 내용을 함께 보고 저장·수정할 수 있습니다. 저장소 URL이 비어 있을 때는 브라우저 저장소와 JSON 백업으로 동작합니다.
      </p>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">공동 편집 방 코드</label>
          <input id="collabRoomInput" type="text" placeholder="예: milyang-2027-team" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">실시간 데이터베이스 베이스 URL (선택)</label>
          <input id="collabDbUrlInput" type="url" placeholder="https://your-project-default-rtdb.firebaseio.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">동료 공유 링크</label>
          <div class="flex gap-2">
            <input id="collabShareUrlInput" type="text" readonly class="flex-1 border border-slate-200 bg-slate-50 rounded-lg px-3 py-2 text-xs text-slate-600" />
            <button type="button" onclick="copyShareLink()" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold">링크 복사</button>
          </div>
        </div>
      </div>
      <div id="collabStatusMsg" class="text-xs text-emerald-700 bg-emerald-50 rounded-lg p-2.5 hidden"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="syncNowFromCloud()" class="px-3 py-2 rounded-lg border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50">지금 동기화</button>
        <button type="button" onclick="saveCollabSettings()" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">설정 저장</button>
      </div>
    </div>
  </div>

  <script>
    const TODAY_ISO = new Date().toISOString().slice(0, 10);
    const STORAGE_KEY = 'milyang_2027_dashboard_v1';
    const COLLAB_KEY = 'milyang_2027_collab_config_v1';

    const SUBJECT_STYLES = {
      '미술': { badge: 'bg-pink-100 text-pink-800 border-pink-200', isCore: false },
      '음악/우쿨렐레': { badge: 'bg-sky-100 text-sky-800 border-sky-200', isCore: false },
      '체육': { badge: 'bg-amber-100 text-amber-800 border-amber-200', isCore: true },
      '과학': { badge: 'bg-emerald-100 text-emerald-800 border-emerald-200', isCore: true },
      '영어': { badge: 'bg-purple-100 text-purple-800 border-purple-200', isCore: true },
      '독서': { badge: 'bg-rose-100 text-rose-800 border-rose-200', isCore: true },
      '영양/보건': { badge: 'bg-slate-200 text-slate-800 border-slate-300', isCore: false },
      '국어': { badge: 'bg-slate-100 text-slate-700 border-slate-200', isCore: true },
      '수학': { badge: 'bg-slate-100 text-slate-700 border-slate-200', isCore: true }
    };

    const EVENT_CATEGORY_STYLES = {
      '학사행사': 'bg-indigo-100 text-indigo-800 border-indigo-200',
      '문화예술': 'bg-pink-100 text-pink-800 border-pink-200',
      '공휴일': 'bg-rose-100 text-rose-800 border-rose-200',
      '업무 추진': 'bg-amber-100 text-amber-800 border-amber-200',
      '친목 행사': 'bg-emerald-100 text-emerald-800 border-emerald-200'
    };

    const DEFAULT_SUBJECT_ROOMS = {
      '과학': '과학실',
      '체육': '체육관',
      '미술': '미술실',
      '음악/우쿨렐레': '음악실'
    };

    function getSubjectRoomId(subject) {
      return DEFAULT_SUBJECT_ROOMS[subject] || null;
    }

    function getDefaultInstructors() {
      return [
        { id: 'inst-1', name: '김예술 강사', subject: '미술', phone: '010-1234-5678', note: '문화예술 중점 프로그램' },
        { id: 'inst-2', name: '박음악 강사', subject: '음악/우쿨렐레', phone: '010-2345-6789', note: '우쿨렐레·합창 지도' },
        { id: 'inst-3', name: '이보건 교사', subject: '영양/보건', phone: '010-3456-7890', note: '보건·영양 교육' }
      ];
    }

    function getDefaultState() {
      return {
        baseDate: TODAY_ISO,
        pinCode: '0000',
        vacationSchedule: {
          summerBreakStart: '2027-07-22',
          summerBreakEnd: '2027-08-16',
          winterBreakStart: '2027-12-29'
        },
        dailyLogs: {
          [TODAY_ISO]: '오늘의 주요 학사·업무 일지를 기록하세요.'
        },
        timetable: {
          '1학기': [
            { id: 'tt-1', week: 1, day: '월', period: 1, gradeClass: '1-1', subject: '국어' },
            { id: 'tt-2', week: 1, day: '월', period: 2, gradeClass: '1-1', subject: '미술' },
            { id: 'tt-3', week: 1, day: '화', period: 3, gradeClass: '1-1', subject: '음악/우쿨렐레' },
            { id: 'tt-4', week: 1, day: '수', period: 2, gradeClass: '1-1', subject: '체육' },
            { id: 'tt-5', week: 1, day: '목', period: 4, gradeClass: '1-1', subject: '과학' }
          ],
          '2학기': [
            { id: 'tt-6', week: 1, day: '월', period: 1, gradeClass: '1-1', subject: '영어' },
            { id: 'tt-7', week: 1, day: '화', period: 2, gradeClass: '1-1', subject: '독서' },
            { id: 'tt-8', week: 1, day: '수', period: 3, gradeClass: '1-1', subject: '영양/보건' }
          ]
        },
        students: [
          { id: 'st-1', name: '김하준', gradeClass: '1-1', busCourse: '1호차(미양면)', stop: '미양초등학교 앞', tags: ['밴드부', '두드림'], history: ['2027-03-02 입학'] },
          { id: 'st-2', name: '이서윤', gradeClass: '1-1', busCourse: '1호차(미양면)', stop: '양지마을 입구', tags: ['기초학력수업'], history: ['2027-03-02 입학'] },
          { id: 'st-3', name: '박도윤', gradeClass: '1-1', busCourse: '2호차(안성시내)', stop: '안성중앙사거리', tags: ['밴드부'], history: ['2027-03-02 입학'] }
        ],
        events: [
          { id: 'ev-1', title: '입학식 및 시업식', category: '학사행사', startDate: '2027-03-02', endDate: '2027-03-02', note: '2027학년도 1학기 시작' },
          { id: 'ev-2', title: '친구사랑 주간', category: '친목 행사', startDate: '2027-03-15', endDate: '2027-03-19', note: '전교생 어울림 활동 및 학급 캠페인' },
          { id: 'ev-3', title: '문예체 교육계획 수립 협의', category: '업무 추진', startDate: '2027-03-10', endDate: '2027-03-12', note: '강사 일정 및 수업 시수 조율' }
        ],
        busCourses: [
          { id: 'bus-1', name: '1호차(미양면)', direction: '등교', driver: '최기사님', stops: ['미양리회관', '양지마을 입구', '미양초등학교 앞'] },
          { id: 'bus-2', name: '2호차(안성시내)', direction: '하교', driver: '정기사님', stops: ['미양초등학교 앞', '안성중앙사거리'] }
        ],
        instructors: getDefaultInstructors(),
        rooms: ['체육관', '과학실', '미술실', '음악실'],
        updatedAt: Date.now()
      };
    }

    function loadCollabConfig() {
      const params = new URLSearchParams(window.location.search);
      const urlRoom = params.get('room');
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(COLLAB_KEY) || '{}');
      } catch (e) {
        saved = {};
      }
      const room = (urlRoom || saved.room || 'milyang-2027-default').trim();
      const dbUrl = (saved.dbUrl || '').trim().replace(/\/+$/, '');
      return { room, dbUrl };
    }

    let collabConfig = loadCollabConfig();
    let appState = loadAppState();
    let currentTab = 'dashboard';
    let currentTimetableSemester = '1학기';
    let currentTimetableView = 'weekly';
    let currentTimetableDay = '월';
    let currentTimetableWeek = 1;
    let currentSubjectFilter = 'ALL';
    let currentBusDirectionFilter = 'ALL';
    let currentStudentTagFilter = 'ALL';
    let currentStudentSearch = '';
    let timetableMonthCursor = new Date(2027, 2, 1);
    let eventMonthCursor = new Date(2027, 2, 1);
    let draggedEntryId = null;
    let adminUnlocked = false;

    function loadAppState() {
      const fallback = getDefaultState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          ...fallback,
          ...parsed,
          vacationSchedule: { ...fallback.vacationSchedule, ...(parsed.vacationSchedule || {}) },
          dailyLogs: { ...fallback.dailyLogs, ...(parsed.dailyLogs || {}) },
          timetable: {
            '1학기': Array.isArray(parsed.timetable?.['1학기']) ? parsed.timetable['1학기'] : fallback.timetable['1학기'],
            '2학기': Array.isArray(parsed.timetable?.['2학기']) ? parsed.timetable['2학기'] : fallback.timetable['2학기']
          },
          students: Array.isArray(parsed.students) ? parsed.students : fallback.students,
          events: Array.isArray(parsed.events) ? parsed.events : fallback.events,
          busCourses: Array.isArray(parsed.busCourses) ? parsed.busCourses : fallback.busCourses,
          instructors: Array.isArray(parsed.instructors) ? parsed.instructors : fallback.instructors,
          rooms: Array.isArray(parsed.rooms) ? parsed.rooms : fallback.rooms
        };
      } catch (e) {
        return fallback;
      }
    }

    function saveAppState(pushCloud = true) {
      appState.updatedAt = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('로컬 저장 오류:', e);
      }
      if (pushCloud && collabConfig.dbUrl && collabConfig.room) {
        const endpoint = `${collabConfig.dbUrl}/milyang2027/${encodeURIComponent(collabConfig.room)}.json`;
        fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(appState)
        }).catch(err => console.warn('클라우드 동기화 대기 중:', err));
      }
    }

    async function syncNowFromCloud() {
      if (!collabConfig.dbUrl || !collabConfig.room) {
        showCollabStatus('실시간 데이터베이스 URL이 없어 현재 브라우저 저장소 기준으로 동작 중입니다.');
        return;
      }
      try {
        const endpoint = `${collabConfig.dbUrl}/milyang2027/${encodeURIComponent(collabConfig.room)}.json`;
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error('네트워크 응답 오류');
        const remote = await res.json();
        if (remote && typeof remote === 'object') {
          appState = { ...getDefaultState(), ...remote };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          renderAllViews();
          showCollabStatus('공동 편집 방 데이터를 최신 상태로 불러왔습니다.');
        } else {
          await saveAppState(true);
          showCollabStatus('현재 데이터를 공동 편집 방에 등록했습니다.');
        }
      } catch (e) {
        showCollabStatus('동기화에 실패했습니다. URL이나 방 코드를 확인해 주세요.');
      }
    }

    function updateRoomBadge() {
      const badge = document.getElementById('roomBadge');
      if (!badge) return;
      if (collabConfig.dbUrl) {
        badge.textContent = `실시간 방: ${collabConfig.room}`;
        badge.className = 'px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200';
      } else {
        badge.textContent = `방 코드: ${collabConfig.room} (브라우저/JSON 모드)`;
        badge.className = 'px-2.5 py-0.5 text-xs font-medium rounded-full bg-slate-100 text-slate-700 border border-slate-200';
      }
    }

    function openCollabModal() {
      const modal = document.getElementById('collabModal');
      document.getElementById('collabRoomInput').value = collabConfig.room;
      document.getElementById('collabDbUrlInput').value = collabConfig.dbUrl;
      const shareUrl = new URL(window.location.href);
      shareUrl.searchParams.set('room', collabConfig.room);
      document.getElementById('collabShareUrlInput').value = shareUrl.toString();
      document.getElementById('collabStatusMsg').classList.add('hidden');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeCollabModal() {
      const modal = document.getElementById('collabModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveCollabSettings() {
      const room = (document.getElementById('collabRoomInput').value || 'milyang-2027-default').trim();
      const dbUrl = (document.getElementById('collabDbUrlInput').value || '').trim().replace(/\/+$/, '');
      collabConfig = { room, dbUrl };
      localStorage.setItem(COLLAB_KEY, JSON.stringify(collabConfig));
      const shareUrl = new URL(window.location.href);
      shareUrl.searchParams.set('room', collabConfig.room);
      window.history.replaceState({}, '', shareUrl.toString());
      document.getElementById('collabShareUrlInput').value = shareUrl.toString();
      updateRoomBadge();
      showCollabStatus('공동 편집 설정이 저장되었습니다.');
      if (dbUrl) {
        syncNowFromCloud();
      }
    }

    function copyShareLink() {
      const input = document.getElementById('collabShareUrlInput');
      if (!input) return;
      input.select();
      navigator.clipboard?.writeText(input.value).catch(() => {});
      showCollabStatus('공유 링크가 클립보드에 복사되었습니다.');
    }

    function showCollabStatus(msg) {
      const el = document.getElementById('collabStatusMsg');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function parseDateUTC(isoStr) {
      const [y, m, d] = (isoStr || TODAY_ISO).split('-').map(Number);
      return new Date(Date.UTC(y, (m || 1) - 1, d || 1));
    }

    function diffDaysISO(fromISO, toISO) {
      const a = parseDateUTC(fromISO).getTime();
      const b = parseDateUTC(toISO).getTime();
      return Math.round((b - a) / (1000 * 60 * 60 * 24));
    }

    function computeVacationCountdown(baseISO) {
      const sStart = appState.vacationSchedule.summerBreakStart || '2027-07-22';
      const sEnd = appState.vacationSchedule.summerBreakEnd || '2027-08-16';
      const wStart = appState.vacationSchedule.winterBreakStart || '2027-12-29';

      if (baseISO < sStart) {
        const d = diffDaysISO(baseISO, sStart);
        return {
          title: '여름방학식 카운트다운',
          badge: d === 0 ? 'D-Day' : `D-${d}`,
          description: `여름방학식(${sStart})까지 ${d}일 남았습니다.`
        };
      }
      if (baseISO >= sStart && baseISO <= sEnd) {
        const rem = diffDaysISO(baseISO, sEnd) + 1;
        return {
          title: '여름방학 기간 중',
          badge: `남은 방학 ${rem}일`,
          description: `여름방학이 진행 중이며, 2학기 개학 전까지 ${rem}일 남았습니다.`
        };
      }
      const dWinter = diffDaysISO(baseISO, wStart);
      return {
        title: dWinter >= 0 ? '겨울방학식(종업식) 카운트다운' : '종업식 경과',
        badge: dWinter === 0 ? 'D-Day' : dWinter > 0 ? `D-${dWinter}` : `D+${Math.abs(dWinter)}`,
        description: dWinter >= 0
          ? `2학기 개학 후 겨울방학식·종업식(${wStart})까지 ${dWinter}일 남았습니다.`
          : `겨울방학식·종업식(${wStart})이 지났습니다.`
      };
    }

    function changeBaseDate(val) {
      if (!val) return;
      appState.baseDate = val;
      saveAppState();
      renderAllViews();
    }

    function jumpToBaseDate(iso) {
      appState.baseDate = iso;
      document.getElementById('baseDateInput').value = iso;
      saveAppState();
      renderAllViews();
    }

    function jumpToToday() {
      const today = new Date().toISOString().slice(0, 10);
      jumpToBaseDate(today);
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-active';
        } else {
          btn.className = 'tab-btn px-4 py-2 rounded-xl text-sm font-semibold border border-slate-200 tab-inactive';
        }
      });
      renderAllViews();
    }

    function calculateActualClassHours(semester) {
      const rows = appState.timetable[semester] || [];
      return rows.filter(r => {
        const style = SUBJECT_STYLES[r.subject];
        return style ? !style.isCore : true;
      }).length;
    }

    function renderDashboard() {
      const baseDate = appState.baseDate || TODAY_ISO;
      const countdown = computeVacationCountdown(baseDate);
      const logText = appState.dailyLogs[baseDate] || '';
      const sem1Hours = calculateActualClassHours('1학기');
      const sem2Hours = calculateActualClassHours('2학기');
      const todayEvents = appState.events.filter(ev => isEventOnDate(ev, baseDate));

      return `
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-2xl p-5 shadow-sm flex flex-col justify-between">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-xs uppercase tracking-wider text-indigo-100 font-semibold">${countdown.title}</p>
                <h2 class="text-2xl font-bold mt-1">${countdown.badge}</h2>
                <p class="text-sm text-indigo-50 mt-1">${countdown.description}</p>
              </div>
              <span class="px-3 py-1 rounded-full bg-white/15 text-xs font-semibold">기준일: ${baseDate}</span>
            </div>
            <div class="mt-4 pt-3 border-t border-white/20 flex flex-wrap gap-4 text-xs text-indigo-100">
              <span>1학기 실제 수업시수(교과 제외): <strong class="text-white">${sem1Hours}차시</strong></span>
              <span>2학기 실제 수업시수(교과 제외): <strong class="text-white">${sem2Hours}차시</strong></span>
              <span>등록 학생 수: <strong class="text-white">${appState.students.length}명</strong></span>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
            <h3 class="text-sm font-bold text-slate-800">기준일 주요 일정 (${baseDate})</h3>
            ${todayEvents.length === 0
              ? `<p class="text-xs text-slate-500">해당 날짜에 등록된 학교행사가 없습니다.</p>`
              : `<ul class="space-y-2">${todayEvents.map(ev => `
                  <li class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <span class="inline-block px-2 py-0.5 text-[11px] font-semibold rounded border ${getEventCategoryStyle(ev.category)}">${ev.category}</span>
                    <div class="text-sm font-semibold text-slate-800 mt-1">${ev.title}</div>
                  </li>`).join('')}</ul>`
            }
          </div>
        </section>

        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-base font-bold text-slate-900">오늘의 학교일지 (${baseDate})</h2>
            <button type="button" onclick="saveDailyLog()" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">일지 저장</button>
          </div>
          <textarea id="dailyLogTextarea" rows="6" class="w-full border border-slate-300 rounded-xl p-3 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="오늘의 교육활동, 업무 추진 사항, 특이사항 등을 입력하세요...">${escapeHtml(logText)}</textarea>
          <p id="dailyLogSavedNotice" class="text-xs text-emerald-600 hidden">일지가 저장되었습니다.</p>
        </section>
      `;
    }

    function saveDailyLog() {
      const baseDate = appState.baseDate || TODAY_ISO;
      const textarea = document.getElementById('dailyLogTextarea');
      if (!textarea) return;
      appState.dailyLogs[baseDate] = textarea.value;
      saveAppState();
      const notice = document.getElementById('dailyLogSavedNotice');
      if (notice) {
        notice.classList.remove('hidden');
        setTimeout(() => notice.classList.add('hidden'), 2000);
      }
    }

    function renderTimetable() {
      const rows = (appState.timetable[currentTimetableSemester] || []).filter(item => {
        if (currentSubjectFilter !== 'ALL' && item.subject !== currentSubjectFilter) return false;
        return true;
      });
      const days = ['월', '화', '수', '목', '금'];
      const periods = [1, 2, 3, 4, 5, 6];
      const subjects = Object.keys(SUBJECT_STYLES);

      return `
        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <button type="button" onclick="currentTimetableSemester='1학기'; renderAllViews();" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTimetableSemester === '1학기' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">1학기</button>
              <button type="button" onclick="currentTimetableSemester='2학기'; renderAllViews();" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTimetableSemester === '2학기' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}">2학기</button>
              <button type="button" onclick="currentTimetableView='weekly'; renderAllViews();" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTimetableView === 'weekly' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">주간 그리드</button>
              <button type="button" onclick="currentTimetableView='monthly'; renderAllViews();" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${currentTimetableView === 'monthly' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">월간 주단위 블록</button>
            </div>
            <div class="flex items-center gap-2">
              <select onchange="currentSubjectFilter=this.value; renderAllViews();" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs">
                <option value="ALL">전체 과목</option>
                ${subjects.map(s => `<option value="${s}" ${currentSubjectFilter === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              <button type="button" onclick="openNewTimetableModal('월', 1)" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">+ 수업 추가</button>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-slate-600">주차:</span>
            ${[1, 2, 3, 4].map(w => `
              <button type="button" onclick="currentTimetableWeek=${w}; renderAllViews();" class="px-2.5 py-1 rounded-md text-xs font-semibold ${currentTimetableWeek === w ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-600'}">${w}주차</button>
            `).join('')}
            <span class="ml-auto text-xs text-slate-500">실제 수업시수(교과 제외): <strong>${calculateActualClassHours(currentTimetableSemester)}차시</strong></span>
          </div>

          ${currentTimetableView === 'weekly'
            ? `<div class="overflow-x-auto">
                <table class="w-full border-collapse text-xs">
                  <thead>
                    <tr class="bg-slate-50">
                      <th class="border border-slate-200 p-2 w-16">교시</th>
                      ${days.map(d => `<th class="border border-slate-200 p-2">${d}요일</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${periods.map(p => `
                      <tr>
                        <td class="border border-slate-200 p-2 text-center font-semibold bg-slate-50">${p}교시</td>
                        ${days.map(d => {
                          const cellItems = rows.filter(r => r.week === currentTimetableWeek && r.day === d && r.period === p);
                          return `
                            <td class="border border-slate-200 p-1.5 align-top min-w-[120px] h-20"
                                ondragover="event.preventDefault()"
                                ondrop="handleDropTimetable(event, '${d}',${p})">
                              <div class="space-y-1">
                                ${cellItems.map(item => {
                                  const st = SUBJECT_STYLES[item.subject] || { badge: 'bg-slate-100 text-slate-800 border-slate-200' };
                                  return `
                                    <div draggable="true"
                                         ondragstart="handleDragStartTimetable(event, '${item.id}')"
                                         onclick="openEditTimetableModal('${item.id}')"
                                         class="cursor-pointer px-2 py-1 rounded border ${st.badge} flex items-center justify-between gap-1">
                                      <span class="font-semibold truncate">${item.subject}</span>
                                      <span class="text-[10px] opacity-80">${item.gradeClass}</span>
                                    </div>`;
                                }).join('')}
                              </div>
                              <button type="button" onclick="openNewTimetableModal('${d}',${p})" class="mt-1 text-[10px] text-slate-400 hover:text-indigo-600">+ 추가</button>
                            </td>`;
                        }).join('')}
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>`
            : renderMonthlyWeekBlocks()
          }
        </section>
      `;
    }

    function renderMonthlyWeekBlocks() {
      const blocks = [
        { label: '3/2 - 3/5', week: 1 },
        { label: '3/8 - 3/12', week: 2 },
        { label: '3/15 - 3/19', week: 3 },
        { label: '3/22 - 3/26', week: 4 }
      ];
      const rows = appState.timetable[currentTimetableSemester] || [];
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
          ${blocks.map(b => {
            const list = rows.filter(r => r.week === b.week);
            return `
              <div class="border border-slate-200 rounded-xl p-3 bg-slate-50/60 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-800">${b.label}</span>
                  <span class="text-xs text-indigo-600 font-semibold">${list.length}건</span>
                </div>
                <div class="space-y-1">
                  ${list.length === 0
                    ? `<p class="text-xs text-slate-400">등록된 수업 없음</p>`
                    : list.map(item => `<div class="text-xs bg-white border border-slate-200 rounded px-2 py-1">${item.day} ${item.period}교시 · <strong>${item.subject}</strong> (${item.gradeClass})</div>`).join('')
                  }
                </div>
              </div>`;
          }).join('')}
        </div>
      `;
    }
